# ============================================================================
#  Deploy the website to GitHub Pages.
#
#  This runs automatically every time you push to the `main` branch. It
#  installs dependencies, builds the site, and publishes the result.
#
#  One-time setup in your repository on github.com:
#    Settings -> Pages -> "Build and deployment" -> Source: "GitHub Actions"
#
#  You do not need to edit this file. See README section J.
# ============================================================================
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  # Lets you re-run a deployment by hand from the Actions tab.
  workflow_dispatch:

# Permissions the deployment needs. Do not remove these.
permissions:
  contents: read
  pages: write
  id-token: write

# If you push twice quickly, let the newer deployment finish.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build the site
        run: npm run build

      - name: Upload the built site
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publish to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
